# fly.toml app configuration file generated for swallow-api on 2026-09-11T03:19:28+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'swallow-api'
primary_region = 'iad'

[build]
[deploy]
  release_command = 'alembic upgrade head'

[env]
  CLERK_AUTHORIZED_PARTIES = 'https://swallow.vercel.app'
  CORS_ORIGINS = ''

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
